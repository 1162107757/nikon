plugins { id 'com.android.application' }

android {
    namespace 'com.nikonpreset.usbprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nikonpreset.usbprobe'
        minSdk 26
        targetSdk 35
        versionCode 66
        versionName '0.12.4-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation files('libs/open_sdk_3.5.19_r9483ffc7_lite.jar')
    // Tencent exposes optional legacy Fragment overloads. This app uses native Activity only.
    compileOnly files('libs/compile-only/support-fragment-28.0.0.jar')
}
