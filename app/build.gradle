plugins { id 'com.android.application' }

android {
    namespace 'com.nikonpreset.usbprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nikonpreset.usbprobe'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.1.8-lab'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
