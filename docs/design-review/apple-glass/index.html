<!--
THESIS: Photography leads; translucent controls float above an uncluttered personal photo library.
OWN-WORLD: Cloud-white and graphite, restrained system blue, 24–30px continuous corners, optical system type, lit glass rims.
STORY: Collect a preset, browse lightweight previews, explicitly download an original, and manage camera connections in Settings.
FIRST VIEWPORT: One coherent direction across library, album and settings; photos occupy the visual center and glass navigation floats below. The immersive viewer opens from an album photo.
NAVIGATION CONTRACT: Three primary destinations — library, album, settings. Camera connection actions belong to settings; library and album show connection status only.
FORM: User-pinned Apple Photos/library material language; code-led design preview, seed b120d374. Other random worlds declined as outside the explicit brief.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
